<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>梨叙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  body { background: #f5f5f5; color: #333; overflow: hidden; }
  :root { --msg-font-size: 15px; }

  .loader-wrapper { position: fixed; inset: 0; z-index: 100; background: #f5f5f5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; transition: opacity 0.35s ease; }
  .loader-wrapper.fade-out { opacity: 0; pointer-events: none; }
  .loader-letters { display: flex; gap: 8px; font-size: 48px; font-weight: 700; color: #333; }
  .loader-letters span { display: inline-block; animation: bounce 1.4s ease-in-out infinite; }
  .loader-letters span:nth-child(1) { animation-delay: 0s; }
  .loader-letters span:nth-child(2) { animation-delay: 0.15s; }
  .loader-letters span:nth-child(3) { animation-delay: 0.3s; }
  .loader-letters span:nth-child(4) { animation-delay: 0.45s; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); color: #666; } }
  .loader-text { font-size: 13px; color: #999; letter-spacing: 2px; max-width: 80%; text-align: center; line-height: 1.6; }

  .app { display: flex; height: 100vh; height: 100dvh; width: 100%; }
  .sidebar { width: 280px; min-width: 240px; background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
  .sidebar-header { padding: 18px 16px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
  .sidebar-header h1 { font-size: 16px; font-weight: 600; color: #333; }
  .wallet-card { margin: 12px 12px 4px; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); border: 1px solid #e8e8e8; border-radius: 10px; padding: 12px 14px; }
  .wallet-title { font-size: 11px; color: #999; margin-bottom: 6px; }
  .wallet-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; font-size: 13px; }
  .wallet-label { color: #666; font-size: 12px; }
  .wallet-balance { color: #333; font-weight: 600; font-size: 14px; }
  .wallet-balance.mine { color: #b45309; }
  .chat-list { flex: 1; overflow-y: auto; padding: 8px; }
  .chat-item { padding: 12px 14px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; margin-bottom: 2px; }
  .chat-item:hover { background: #f0f0f0; }
  .chat-item.active { background: #e0e0e0; }
  .chat-item-title { font-size: 14px; font-weight: 500; color: #333; }
  .sidebar-footer { padding: 12px 16px; border-top: 1px solid #f0f0f0; }
  .btn-manage-replies { width: 100%; margin-top: 10px; padding: 9px; background: #f0f0f0; color: #666; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .store-status { margin-top: 10px; padding: 6px 8px; background: #f8f8f8; border-radius: 4px; font-size: 10px; color: #999; }

  .reply-library-panel, .settings-panel, .period-panel, .mailbox-panel { display: none; position: fixed; inset: 0; z-index: 40; background: #fff; flex-direction: column; }
  .reply-library-panel.show, .settings-panel.show, .period-panel.show, .mailbox-panel.show { display: flex; }
  .rl-header, .settings-header, .mb-header { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; background: #fff; position: sticky; top: 0; z-index: 1; flex-wrap: wrap; gap: 8px; }
  .rl-title, .settings-title, .mb-title { font-size: 16px; font-weight: 500; color: #333; }
  .rl-close-btn, .settings-close-btn, .mb-close-btn { background: none; border: none; color: #666; font-size: 22px; cursor: pointer; padding: 4px 10px; line-height: 1; }
  .rl-body, .settings-body, .mb-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
  
  .rl-tabs, .mb-tabs { display: flex; gap: 6px; margin-left: auto; margin-right: 12px; flex-wrap: wrap; }
  .rl-tab, .mb-tab { padding: 6px 14px; border-radius: 999px; font-size: 12px; cursor: pointer; background: #f0f0f0; color: #666; user-select: none; }
  .rl-tab.active, .mb-tab.active { background: #333; color: #fff; font-weight: 500; }
  
  .rl-tip { font-size: 12px; color: #999; margin-bottom: 12px; line-height: 1.6; background: #f0f0f0; padding: 10px 12px; border-radius: 6px; }
  .rl-input { width: 100%; height: 200px; background: #f0f0f0; color: #333; border: 1px solid #d0d0d0; border-radius: 6px; padding: 12px; font-size: 14px; resize: vertical; line-height: 1.6; }
  .rl-actions { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .rl-btn { padding: 8px 16px; border-radius: 6px; border: none; font-size: 14px; cursor: pointer; }
  .rl-btn-primary { background: #333; color: #fff; }
  .rl-btn-secondary { background: #d0d0d0; color: #333; }
  .rl-groups { margin-top: 20px; }
  .rl-group-item { background: #f0f0f0; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; font-size: 14px; }
  .rl-mood-list { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .rl-mood-item { padding: 5px 12px; border-radius: 999px; background: #fff7e6; color: #b45309; border: 1px solid #f0d98b; font-size: 12px; }

  .main { flex: 1; display: flex; flex-direction: column; background: #f5f5f5; min-width: 0; position: relative; }
  .home-view { flex: 1; display: flex; flex-direction: column; background: #f5f5f5; }
  .home-header { padding: 14px 16px 8px; background: #f5f5f5; display: flex; align-items: center; justify-content: space-between; }
  .home-title { font-size: 18px; font-weight: 600; color: #333; text-align: center; flex: 1; }
  .home-chat-list { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
  .home-chat-card { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .home-chat-avatar { width: 48px; height: 48px; border-radius: 8px; background: #333; color:#fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; }
  .home-chat-info { flex: 1; }
  .home-chat-name { font-size: 15px; font-weight: 500; color: #333; }

  .chat-view { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  .chat-header { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; background: #fff; display: flex; align-items: center; justify-content: space-between; }
  .chat-title-wrap { display: flex; flex-direction: column; }
  .chat-title { font-size: 16px; font-weight: 500; color: #333; }
  .chat-status { font-size: 12px; color: #999; margin-top: 1px; }
  .header-icon-btn { background: none; border: none; color: #666; cursor: pointer; padding: 6px; border-radius: 6px; }
  .header-icon-btn:hover { background: #f0f0f0; }

  .messages { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; background-color: #f5f5f5; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #bbb; }
  .message { display: flex; gap: 10px; max-width: 75%; align-items: flex-start; }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { width: 38px; height: 38px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: #d0d0d0; color: #fff; }
  .message.user .avatar { background: #333; }
  .bubble { padding: 10px 14px; border-radius: 6px; font-size: 15px; line-height: 1.5; word-break: break-word; position: relative; }
  .message.other .bubble { background: #fff; color: #333; }
  .message.user .bubble { background: #333; color: #fff; }
  .message-time { font-size: 11px; color: #999; margin-top: 6px; }

  .input-area { padding: 12px 16px; border-top: 1px solid #f0f0f0; background: #fff; display: none; gap: 10px; align-items: flex-end; }
  .input-area.show { display: flex !important; }
  .input-icon-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: #f0f0f0; color: #666; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .input-wrap { flex: 1; background: #f0f0f0; border-radius: 6px; padding: 9px 12px; display: flex; flex-direction: column; }
  #msgInput { width:100%; flex: 1; background: none; border: none; outline: none; font-size: 16px; resize: none; max-height: 100px; font-family: inherit; }
  .btn-send { background: #333; color: #fff; border: none; border-radius: 6px; padding: 9px 16px; font-size: 14px; cursor: pointer; flex-shrink: 0; }

  .extra-panel { display: none; padding: 20px; background: #fff; border-top: 1px solid #f0f0f0; }
  .extra-panel.show { display: block; }
  .extra-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .extra-item { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; padding: 12px 0; border-radius: 10px; }
  .extra-icon { width: 56px; height: 56px; border-radius: 14px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .extra-label { font-size: 12px; color: #666; }

  .emoji-panel { display: none; flex-direction: column; background: #f5f5f5; border-top: 1px solid #e0e0e0; padding: 12px 16px; height: 200px; }
  .emoji-panel.show { display: flex; }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 10px; overflow-y: auto; align-content: flex-start; }
  .emoji-item { width: 50px; height: 50px; border-radius: 8px; background: #fff; overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .emoji-item img { width: 100%; height: 100%; object-fit: cover; }

  .call-screen { display: none; position: fixed; inset: 0; z-index: 200; background: #222; color: #fff; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  .call-screen.show { display: flex; }
  .call-mini-bubble { display: none; position: fixed; top: 70px; right: 16px; z-index: 250; background: #1a1a1a; border-radius: 999px; padding: 8px 16px; color: #fff; cursor: pointer; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.35); touch-action: none; }
  .call-mini-bubble.show { display: flex; }

  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 500; align-items: center; justify-content: center; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 90%; max-width: 360px; overflow: hidden; display: flex; flex-direction: column; }
  .modal-header { padding: 16px 20px; font-size: 16px; font-weight: 500; text-align: center; border-bottom: 1px solid #f0f0f0; }
  .modal-body { padding: 20px; color: #666; font-size: 14px; }
  .modal-footer { display: flex; border-top: 1px solid #f0f0f0; }
  .modal-btn { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 15px; color: #333; }
  .modal-btn.cancel { color: #666; border-right: 1px solid #f0f0f0; }

  .settings-input-num { width: 60px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
  .custom-css-input { width: 100%; min-height: 120px; background: #1e1e1e; color: #d4d4d4; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 12px; }
  .letter-list-item { background: #f8f8f8; padding: 14px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
  .letter-box { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="loader-wrapper" id="loader">
  <div class="loader-letters"><span>L</span><span>O</span><span>V</span><span>E</span></div>
  <div class="loader-text" id="loaderText">正在加载</div>
</div>

<div class="app" style="visibility:hidden">
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><h1>梨叙</h1></div>
    <div class="wallet-card" id="walletCard">
      <div class="wallet-title" id="walletChatName">—</div>
      <div class="wallet-row"><span class="wallet-label">我方钱包</span><span class="wallet-balance mine" id="myWalletBalance">🌟 9999</span></div>
    </div>
    <div class="chat-list" id="chatListSidebar"></div>
    <div class="sidebar-footer">
      <button class="btn-manage-replies" id="btnManageReplies">字卡库</button>
      <button class="btn-manage-replies" id="btnOpenSettings">⚙️ 设置</button>
      <div class="store-status">存储：本地</div>
    </div>
  </aside>

  <div class="reply-library-panel" id="replyPanel">
    <div class="rl-header">
      <span class="rl-title">字卡库</span>
      <div class="rl-tabs">
        <span class="rl-tab active" data-tab="cards">字卡</span>
        <span class="rl-tab" data-tab="mood">状态</span>
        <span class="rl-tab" data-tab="pat">拍一拍</span>
      </div>
      <button class="rl-close-btn" id="btnCloseReply">×</button>
    </div>
    <div class="rl-body">
      <div id="tabPanelCards">
        <div class="manage-filter-tabs" id="cardsFilterTabs" style="display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;"></div>
        <div class="rl-actions">
          <button class="rl-btn rl-btn-primary" id="btnShowImportMode">导入</button>
        </div>
        <div id="cardsImportMode" style="display:none; margin-top:16px;">
          <textarea class="rl-input" id="replyInput" placeholder="【日常】&#10;你好呀"></textarea>
          <div class="rl-actions"><button class="rl-btn rl-btn-primary" id="btnImportReplies">确认导入</button></div>
        </div>
        <div id="rlGroups"></div>
      </div>
      <div id="tabPanelMood" style="display:none;">
        <textarea id="moodInput" class="rl-input" style="height:80px;"></textarea>
        <div class="rl-actions"><button class="rl-btn rl-btn-primary" id="btnImportMood">导入</button></div>
        <div class="rl-mood-list" id="moodList"></div>
      </div>
      <div id="tabPanelPat" style="display:none;">
        <div class="rl-tip">使用 {other} 代表对方名字，{me} 代表自己。</div>
        <textarea id="patInput" class="rl-input" style="height:80px;"></textarea>
        <div class="rl-actions"><button class="rl-btn rl-btn-primary" id="btnImportPat">导入</button></div>
        <div class="rl-mood-list" id="patList"></div>
      </div>
    </div>
  </div>

  <div class="mailbox-panel" id="mailboxPanel">
    <div class="mb-header">
      <div class="mb-tabs">
        <span class="mb-tab active" data-mbtab="received">收到</span>
        <span class="mb-tab" data-mbtab="sent">发出</span>
        <span class="mb-tab" data-mbtab="write" style="background:#333;color:#fff;">写信</span>
      </div>
      <button class="mb-close-btn" id="btnCloseMailbox">×</button>
    </div>
    <div class="mb-body" id="mbBody"></div>
    <div id="letterDetailView" style="display:none; position:absolute; inset:0; background:#fff; flex-direction:column; z-index:10;">
      <div class="mb-header">
        <button id="btnBackToMailbox" style="border:none;background:none;font-size:16px;">‹ 返回</button>
        <span class="mb-title">信件详情</span>
        <div style="width:30px;"></div>
      </div>
      <div class="mb-body" id="letterDetailContent"></div>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header"><span class="settings-title">设置</span><button class="settings-close-btn" id="btnCloseSettings">×</button></div>
    <div class="settings-body">
      <h3 style="font-size:15px;margin-bottom:10px;">聊天行为</h3>
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;">
        <span>最快延迟</span><div><input type="number" id="delayMin" class="settings-input-num" value="1"> s</div>
      </div>
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;margin-bottom:20px;">
        <span>最慢延迟</span><div><input type="number" id="delayMax" class="settings-input-num" value="10"> s</div>
      </div>
      <h3 style="font-size:15px;margin-bottom:10px;">自定义气泡 CSS</h3>
      <textarea class="custom-css-input" id="customCssInput" placeholder=".message-sent { ... }"></textarea>
      <button class="btn-send" id="btnApplyCss" style="margin-top:10px;width:100%;">应用 CSS</button>
    </div>
  </div>

  <main class="main">
    <div class="home-view" id="homeView">
      <div class="home-header">
        <button class="header-icon-btn" id="homeMenuBtn">≡</button>
        <span class="home-title">✧₍^˶- ˕ -˵^₎✧</span>
        <button class="header-icon-btn" id="homeNewChatBtn">+</button>
      </div>
      <div class="home-chat-list" id="homeChatList"></div>
    </div>

    <div class="chat-view" id="chatView" style="display:none;">
      <div class="chat-header">
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="header-icon-btn" id="chatBackBtn">‹</button>
          <div class="chat-title-wrap"><span class="chat-title" id="chatTitle">—</span></div>
        </div>
        <button class="header-icon-btn" id="btnOpenMailbox" style="font-size:20px;">✉️</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="emoji-panel" id="emojiPanel">
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>
      <div class="input-area" id="inputArea">
        <div class="input-wrap"><textarea id="msgInput" rows="1" placeholder="输入消息..."></textarea></div>
        <button class="input-icon-btn" id="btnEmoji">😀</button>
        <button class="input-icon-btn" id="btnMore">+</button>
        <button class="btn-send" id="btnSend">发送</button>
      </div>
      <div class="extra-panel" id="extraPanel">
        <div class="extra-grid">
          <div class="extra-item" data-type="transfer"><div class="extra-icon">💳</div><span class="extra-label">转账</span></div>
          <div class="extra-item" data-type="period"><div class="extra-icon">📅</div><span class="extra-label">月经</span></div>
          <div class="extra-item" data-type="call"><div class="extra-icon">📞</div><span class="extra-label">语音通话</span></div>
          <div class="extra-item" data-type="pat"><div class="extra-icon">🤍</div><span class="extra-label">拍一拍</span></div>
        </div>
      </div>
    </div>
  </main>

  <div class="call-mini-bubble" id="callMiniBubble"><div id="callMiniName" style="font-size:12px;">通话中</div></div>
  <div class="call-screen" id="callScreen">
    <button id="callMinimizeBtn" style="position:absolute;top:20px;right:20px;background:none;border:none;color:#fff;font-size:20px;">-</button>
    <h2 id="callName">对方</h2>
    <div id="callTimer" style="font-size:30px;">00:00</div>
    <button id="callHangup" style="margin-top:30px;background:#e53935;color:#fff;border:none;padding:12px 30px;border-radius:20px;">挂断</button>
  </div>

  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <div class="modal-header" id="modalTitle">提示</div>
      <div class="modal-body" id="modalBody">内容</div>
      <div class="modal-footer">
        <div class="modal-btn cancel" id="modalCancel">取消</div>
        <div class="modal-btn" id="modalOk">确定</div>
      </div>
    </div>
  </div>
</div>
<script>
var DB = { chats: [], messages: [], wordcards: [], letters: [], settings: {}, emojis: [] };
var currentChatId = null;
var LS_KEY = 'lixu_final';
var callState = { active: false, timer: null, sec: 0 };

function save() { localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
function load() {
  var s = localStorage.getItem(LS_KEY);
  if (s) { try { var p = JSON.parse(s); for(var k in p) DB[k] = p[k]; } catch(e){} }
}
load();

function ID() { return Date.now() + Math.floor(Math.random()*1000); }
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// 初始化
function init() {
  document.querySelector('.app').style.visibility = 'visible';
  document.getElementById('loader').classList.add('fade-out');
  setTimeout(()=>{ document.getElementById('loader').style.display = 'none'; }, 400);

  if (!DB.chats.length) { DB.chats.push({ id: ID(), name: '试验' }); save(); }
  
  renderHomeList();
  document.getElementById('delayMin').value = DB.settings.delayMin || 1;
  document.getElementById('delayMax').value = DB.settings.delayMax || 10;
  document.getElementById('customCssInput').value = DB.settings.customCss || '';
  applyCustomCss(DB.settings.customCss);
  bindEvents();
}

// 渲染主页
function renderHomeList() {
  var html = DB.chats.map(c => `<div class="home-chat-card" onclick="enterChat(${c.id})"><div class="home-chat-avatar">${esc(c.name[0])}</div><div class="home-chat-info"><div class="home-chat-name">${esc(c.name)}</div></div></div>`).join('');
  document.getElementById('homeChatList').innerHTML = html || '<div class="home-empty">暂无会话</div>';
  
  var sb = DB.chats.map(c => `<div class="chat-item" onclick="enterChat(${c.id})"><div class="chat-item-title">${esc(c.name)}</div></div>`).join('');
  document.getElementById('chatListSidebar').innerHTML = sb;
}

// 进入聊天
function enterChat(id) {
  currentChatId = id;
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('chatView').style.display = 'flex';
  document.getElementById('chatTitle').textContent = DB.chats.find(c => c.id === id).name;
  document.getElementById('inputArea').classList.add('show');
  renderMessages();
}

// 渲染消息
function renderMessages() {
  var box = document.getElementById('messages');
  box.innerHTML = DB.messages.filter(m => m.chatId === currentChatId).map(m => {
    var av = m.sender === 'user' ? '我' : 'TA';
    if (m.type === 'pat') return `<div style="text-align:center;font-size:12px;color:#999;margin:10px 0;">${esc(m.text)}</div>`;
    return `<div class="message ${m.sender}">
      <div class="avatar">${av}</div>
      <div class="bubble ${m.sender==='user'?'message-sent':'message-received'}">${m.type==='image'?`<img src="${m.text}" style="max-width:100%;max-height:200px;border-radius:6px;object-fit:contain;">`:esc(m.text)}</div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

// 核心：CSS 映射
function applyCustomCss(css) {
  if (!css) {
    var st = document.getElementById('dynamicCss'); if(st) st.innerHTML = '';
    return;
  }
  var mappedCss = css.replace(/\.message-sent/g, '.message.user .bubble')
                     .replace(/\.message-received/g, '.message.other .bubble');
  var style = document.getElementById('dynamicCss');
  if (!style) { style = document.createElement('style'); style.id = 'dynamicCss'; document.head.appendChild(style); }
  style.innerHTML = mappedCss;
}

// 绑定事件
function bindEvents() {
  document.getElementById('homeMenuBtn').onclick = () => { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); };
  document.getElementById('overlay').onclick = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); };
  
  document.getElementById('btnManageReplies').onclick = () => { document.getElementById('replyPanel').classList.add('show'); renderWordcards(); };
  document.getElementById('btnOpenSettings').onclick = () => document.getElementById('settingsPanel').classList.add('show');
  document.getElementById('btnCloseSettings').onclick = () => document.getElementById('settingsPanel').classList.remove('show');
  document.getElementById('btnCloseReply').onclick = () => document.getElementById('replyPanel').classList.remove('show');
  
  document.getElementById('btnOpenMailbox').onclick = () => { document.getElementById('mailboxPanel').classList.add('show'); document.querySelector('.mb-tab[data-mbtab="received"]').click(); };
  document.getElementById('btnCloseMailbox').onclick = () => document.getElementById('mailboxPanel').classList.remove('show');
  document.getElementById('btnBackToMailbox').onclick = () => { document.getElementById('letterDetailView').style.display = 'none'; renderMailbox(); };

  document.getElementById('chatBackBtn').onclick = () => { document.getElementById('chatView').style.display = 'none'; document.getElementById('homeView').style.display = 'flex'; renderHomeList(); };
  
  document.getElementById('btnEmoji').onclick = () => { document.getElementById('emojiPanel').classList.toggle('show'); document.getElementById('extraPanel').classList.remove('show'); };
  document.getElementById('btnMore').onclick = () => { document.getElementById('extraPanel').classList.toggle('show'); document.getElementById('emojiPanel').classList.remove('show'); };
  
  document.getElementById('btnApplyCss').onclick = () => {
    var css = document.getElementById('customCssInput').value;
    DB.settings.customCss = css; save(); applyCustomCss(css); alert('气泡 CSS 应用成功！');
  };

  document.getElementById('btnShowImportMode').onclick = () => {
    document.getElementById('cardsImportMode').style.display = 'block';
    document.getElementById('btnShowImportMode').style.display = 'none';
  };

  document.getElementById('btnImportReplies').onclick = () => {
    var txt = document.getElementById('replyInput').value;
    if(!txt) return;
    var lines = txt.split('\n'); var currG = '默认';
    lines.forEach(l => {
      l = l.trim(); if(!l) return;
      var m = l.match(/^【(.+)】$/);
      if(m) currG = m[1];
      else DB.wordcards.push({ id: ID(), group: currG, text: l });
    });
    save(); renderWordcards(); document.getElementById('replyInput').value = '';
    document.getElementById('cardsImportMode').style.display = 'none';
    document.getElementById('btnShowImportMode').style.display = 'block';
  };

  document.getElementById('btnImportPat').onclick = () => {
    var txt = document.getElementById('patInput').value;
    if(!txt) return;
    DB.settings.patList = (DB.settings.patList || []).concat(txt.split('\n').filter(x=>x.trim()));
    save(); alert('导入成功'); document.getElementById('patInput').value = '';
    renderPatList();
  };

  document.getElementById('btnImportMood').onclick = () => {
    var txt = document.getElementById('moodInput').value;
    if(!txt) return;
    DB.settings.moodList = (DB.settings.moodList || []).concat(txt.split('\n').filter(x=>x.trim()));
    save(); alert('导入成功'); document.getElementById('moodInput').value = '';
    renderMoodList();
  };

  // Tab切换
  document.querySelectorAll('.rl-tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.rl-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.rl-tab-panel, #tabPanelCards, #tabPanelMood, #tabPanelPat').forEach(p => p.style.display = 'none');
      tab.classList.add('active');
      var target = tab.getAttribute('data-tab');
      if(target==='cards') document.getElementById('tabPanelCards').style.display = 'block';
      if(target==='mood') document.getElementById('tabPanelMood').style.display = 'block';
      if(target==='pat') document.getElementById('tabPanelPat').style.display = 'block';
      if(target === 'cards') renderWordcards();
      if(target === 'pat') renderPatList();
      if(target === 'mood') renderMoodList();
    };
  });

  document.querySelectorAll('.mb-tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.mb-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderMailbox();
    };
  });

  // 附加功能面板
  document.querySelectorAll('.extra-item').forEach(el => {
    el.onclick = () => {
      var type = el.getAttribute('data-type');
      document.getElementById('extraPanel').classList.remove('show');
      if (type === 'pat') {
        var list = DB.settings.patList || [];
        if (!list.length) return alert('请去字卡库导入拍一拍');
        var chat = DB.chats.find(c => c.id === currentChatId);
        var text = list[Math.floor(Math.random() * list.length)].replace(/\{other\}/g, chat.name).replace(/\{me\}/g, "自己");
        DB.messages.push({ id: ID(), chatId: currentChatId, text: "我 " + text, sender: 'user', type: 'pat', createdAt: Date.now() });
        save(); renderMessages();
      }
      if (type === 'call') {
        if (callState.active) return;
        callState.active = true; callState.sec = 0;
        document.getElementById('callScreen').classList.add('show');
        callState.timer = setInterval(() => {
          callState.sec++;
          document.getElementById('callTimer').textContent = String(Math.floor(callState.sec/60)).padStart(2,'0') + ':' + String(callState.sec%60).padStart(2,'0');
        }, 1000);
      }
    };
  });

  document.getElementById('callMinimizeBtn').onclick = () => { document.getElementById('callScreen').classList.remove('show'); document.getElementById('callMiniBubble').classList.add('show'); };
  document.getElementById('callMiniBubble').onclick = () => { document.getElementById('callScreen').classList.add('show'); document.getElementById('callMiniBubble').classList.remove('show'); };
  document.getElementById('callHangup').onclick = () => { clearInterval(callState.timer); callState.active = false; document.getElementById('callScreen').classList.remove('show'); document.getElementById('callMiniBubble').classList.remove('show'); };
  
  document.getElementById('delayMin').onchange = e => { DB.settings.delayMin = parseInt(e.target.value); save(); };
  document.getElementById('delayMax').onchange = e => { DB.settings.delayMax = parseInt(e.target.value); save(); };

  // 发送消息
  document.getElementById('btnSend').onclick = () => {
    var val = document.getElementById('msgInput').value.trim();
    if(!val) return;
    DB.messages.push({ id: ID(), chatId: currentChatId, text: val, sender: 'user', type: 'text', createdAt: Date.now() });
    document.getElementById('msgInput').value = '';
    save(); renderMessages();
  };
}

// 渲染字卡
function renderWordcards() {
  var tabs = document.getElementById('cardsFilterTabs');
  var groups = {}; DB.wordcards.forEach(w => groups[w.group] = (groups[w.group]||0)+1);
  var html = `<div class="manage-filter-tab active" onclick="setGroup('全部')">全部 (${DB.wordcards.length})</div>`;
  for(var g in groups) html += `<div class="manage-filter-tab" onclick="setGroup('${g}')">${esc(g)} (${groups[g]})</div>`;
  tabs.innerHTML = html;

  var list = DB.wordcards;
  document.getElementById('rlGroups').innerHTML = list.map(w => `<div class="rl-group-item">${esc(w.text)} <span style="color:#999;font-size:12px;">[${esc(w.group)}]</span></div>`).join('');
}
function setGroup(g) {
  var list = g === '全部' ? DB.wordcards : DB.wordcards.filter(w => w.group === g);
  document.getElementById('rlGroups').innerHTML = list.map(w => `<div class="rl-group-item">${esc(w.text)}</div>`).join('');
}

function renderPatList() {
  var list = DB.settings.patList || [];
  document.getElementById('patList').innerHTML = list.map(t => `<div class="rl-mood-item">${esc(t)}</div>`).join('');
}

function renderMoodList() {
  var list = DB.settings.moodList || [];
  document.getElementById('moodList').innerHTML = list.map(t => `<div class="rl-mood-item">${esc(t)}</div>`).join('');
}

// 信箱渲染
function renderMailbox() {
  var body = document.getElementById('mbBody');
  document.getElementById('letterDetailView').style.display = 'none';
  var tab = document.querySelector('.mb-tab.active').getAttribute('data-mbtab');
  
  if (tab === 'write') {
    body.innerHTML = `
      <textarea id="newLetterText" class="rl-input" style="height:150px;margin-bottom:10px;" placeholder="写下你想说的话..."></textarea>
      <button class="rl-btn rl-btn-primary" style="width:100%;" onclick="sendLetter()">发送信件</button>
    `;
    return;
  }

  var isReceived = tab === 'received';
  var letters = DB.letters.filter(l => l.chatId === currentChatId && l.direction === tab);
  
  if (!letters.length) {
    body.innerHTML = `<div style="text-align:center;color:#999;margin-top:50px;">暂无信件</div>`;
    return;
  }

  body.innerHTML = letters.map(l => `
    <div class="letter-list-item" onclick="openLetterDetail(${l.id})">
      <div style="font-size:15px;font-weight:500;">${isReceived?'来自对方的信':'我发出的信'}</div>
      <div class="letter-meta" style="margin-top:5px;font-size:12px;color:#999;">${new Date(l.createdAt).toLocaleString()}</div>
    </div>
  `).join('');
}

function sendLetter() {
  var text = document.getElementById('newLetterText').value.trim();
  if (!text) return alert('内容不能为空');
  DB.letters.push({ id: ID(), chatId: currentChatId, direction: 'sent', text: text, createdAt: Date.now() });
  save(); document.querySelector('.mb-tab[data-mbtab="sent"]').click();
  setTimeout(() => {
    DB.letters.push({ id: ID(), chatId: currentChatId, direction: 'received', text: '收到你的信啦，我也很想你。', createdAt: Date.now() });
    save(); alert('收到一封新回信！');
  }, 5000);
}

function openLetterDetail(id) {
  var l = DB.letters.find(x => x.id === id);
  document.getElementById('letterDetailView').style.display = 'flex';
  document.getElementById('letterDetailContent').innerHTML = `
    <div class="letter-box">
      <div class="letter-meta" style="font-size:12px;color:#999;margin-bottom:8px;">${new Date(l.createdAt).toLocaleString()}</div>
      <div class="letter-text" style="font-size:14px;line-height:1.6;">${esc(l.text)}</div>
    </div>
    <textarea id="replyText" class="rl-input" style="height:80px;margin-top:10px;" placeholder="回信..."></textarea>
    <button class="rl-btn rl-btn-primary" style="width:100%;margin-top:10px;" onclick="replyLetter(${l.id})">发送回信</button>
  `;
}

function replyLetter(id) {
  var text = document.getElementById('replyText').value.trim();
  if (!text) return;
  var l = DB.letters.find(x => x.id === id);
  l.text += "\n\n[回复] " + text;
  save(); alert('回信成功！'); openLetterDetail(id);
}

window.onload = init;
</script>
</body>
</html>
